<!DOCTYPE html>
<html lang="zh-CN">

<head>

<body>

                <source id="tts-audio-source" src="" type="audio/wav">

        </div>

            </svg>

                <path d="M0.226497 6L6 11.7735L11.7735 6L6 0.226497L0.226497 6ZM6 7L181 7.00002L181 5.00002L6 5L6 7Z"

            </svg>
        </div>
        <!-- 人物卡里的内容 -->

            </div>
            <div id="basic-information">

            <div id="attribute">
                <span id="title-attribute">Ⅱ&nbsp;&nbsp;属性</span>

                    <span id="str-bar-1">
                        <svg id="str-light-spot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 69" fill="none">
                            <g style="mix-blend-mode:color-dodge">
                                <ellipse cx="42.6667" cy="34.4863" rx="42.6667" ry="34.2954"
                                    fill="url(#paint0_radial_51_96)" />
                            </g>
                            <defs>
                                <radialGradient id="paint0_radial_51_96" cx="0" cy="0" r="1"
                                    gradientUnits="userSpaceOnUse"

                            </defs>
                        </svg>

                <span id="dex">敏捷DEX：<span>75</span>

                        <svg id="dex-light-spot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 69" fill="none">
                            <g style="mix-blend-mode:color-dodge">
                                <ellipse cx="42.6667" cy="34.4863" rx="42.6667" ry="34.2954"
                                    fill="url(#paint0_radial_51_96)" />
                            </g>
                            <defs>
                                <radialGradient id="paint0_radial_51_96" cx="0" cy="0" r="1"
                                    gradientUnits="userSpaceOnUse"
                                    gradientTransform="translate(42.6667 34.4863) rotate(90) scale(34.2954 42.6667)">
                                    <stop stop-color="#D9D9D9" />
                                    <stop offset="1" stop-opacity="0" />
                                </radialGradient>
                            </defs>
                        </svg>
                    </span>
                    <span id="dex-bar-2"></span>
                    <span id="dex-bar-3"></span>
                </span>

                <span id="luk">幸运LUK：<span>66</span>
                    <span>
                        <span id="luk-bar-1">
                            <svg id="luk-light-spot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 69"

                                <g style="mix-blend-mode:color-dodge">
                                    <ellipse cx="42.6667" cy="34.4863" rx="42.6667" ry="34.2954"
                                        fill="url(#paint0_radial_51_96)" />
                                </g>
                                <defs>
                                    <radialGradient id="paint0_radial_51_96" cx="0" cy="0" r="1"
                                        gradientUnits="userSpaceOnUse"
                                        gradientTransform="translate(42.6667 34.4863) rotate(90) scale(34.2954 42.6667)">
                                        <stop stop-color="#D9D9D9" />
                                        <stop offset="1" stop-opacity="0" />
                                    </radialGradient>
                                </defs>
                            </svg>
                        </span>
                        <span id="luk-bar-2"></span>
                        <span id="luk-bar-3"></span>

                    </span>
                </span>

                <span id="int">智力INT：<span>80</span>
                    <span id="int-bar-1">
                        <svg id="int-light-spot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 69" fill="none">
                            <g style="mix-blend-mode:color-dodge">
                                <ellipse cx="42.6667" cy="34.4863" rx="42.6667" ry="34.2954"
                                    fill="url(#paint0_radial_51_96)" />
                            </g>
                            <defs>
                                <radialGradient id="paint0_radial_51_96" cx="0" cy="0" r="1"
                                    gradientUnits="userSpaceOnUse"
                                    gradientTransform="translate(42.6667 34.4863) rotate(90) scale(34.2954 42.6667)">
                                    <stop stop-color="#D9D9D9" />
                                    <stop offset="1" stop-opacity="0" />
                                </radialGradient>
                            </defs>
                        </svg>
                    </span>
                    <span id="int-bar-2"></span>
                    <span id="int-bar-3"></span>
                </span>
            </div>


            <div id="skill">
                <span id="title-skill">Ⅲ&nbsp;&nbsp;技能</span>
                <span id="inspect">侦察：<span>36</span></span>
                <span id="psychology">心理学：<span>51</span></span>
                <span id="social">交涉：<span>37</span></span>
                <span id="run">跑步：<span>23</span></span>
                <span id="library-use">图书馆使用：<span>40</span></span>
                <span id="credit">信用：<span>53</span></span>
            </div>

        </div>
    </div>

    <!-- 等待侦察指数的页面 -->
    <div id="waiting-for-dice">
        <svg id="color-logo" xmlns="http://www.w3.org/2000/svg" width="84" height="84" viewBox="0 0 84 84" fill="none">
            <circle cx="42" cy="42" r="42" fill="url(#paint0_linear_45_571)" />
            <defs>
                <linearGradient id="paint0_linear_45_571" x1="0" y1="84.0018" x2="328.371" y2="84.0018"
                    gradientUnits="userSpaceOnUse">
                    <stop stop-color="#3ADFFF" />
                    <stop offset="0.25" stop-color="#FF8F51" />
                    <stop offset="0.5" stop-color="#4469EF" />
                    <stop offset="0.75" stop-color="#3ADFFF" />
                    <stop offset="1" stop-color="#FF8F51" />
                </linearGradient>
            </defs>
        </svg>
        <span id="waiting-text">您的侦察数值是...</span>
    </div>

                },

    <!-- 根据上一个页面选择的人物不同加载不同的数据和人物图片 -->
    <script>
        // 定义一个函数，用于获取url中的查询参数，即获取1/2/3的card号码
        function getQueryParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        //定义一个函数，根据不同的card号码加载不同的数据和图片
        document.addEventListener('DOMContentLoaded', function () {
            const cardNumber = getQueryParameter('card') || '1';//获取url中的查询参数
            const imageElement = document.getElementById('character-image');//加载图片
            const characterData = characters[cardNumber];//加载数据

            if (characterData) {
                // 填充基本信息
                document.querySelector('#gender span:last-child').textContent = characterData['basic-information'].gender;
                document.querySelector('#age span:last-child').textContent = characterData['basic-information'].age;
                document.querySelector('#occupation span:last-child').textContent = characterData['basic-information'].occupation;
                document.querySelector('#address span:last-child').textContent = characterData['basic-information'].address;

                // 填充属性信息
                document.querySelector('#str span:first-child').textContent = characterData.attribute.str;
                document.querySelector('#dex span:first-child').textContent = characterData.attribute.dex;
                document.querySelector('#luk span:first-child').textContent = characterData.attribute.luk;
                document.querySelector('#int span:first-child').textContent = characterData.attribute.int;

                // 填充技能信息
                document.querySelector('#inspect span:last-child').textContent = characterData.skill.inspect;
                document.querySelector('#psychology span:last-child').textContent = characterData.skill.psychology;
                document.querySelector('#social span:last-child').textContent = characterData.skill.social;
                document.querySelector('#run span:last-child').textContent = characterData.skill.run;
                document.querySelector('#library-use span:last-child').textContent = characterData.skill['library-use'];
                document.querySelector('#credit span:last-child').textContent = characterData.skill.credit;

                updateLightSpots(characterData.attribute);
                // 填充属性信息并更新light-spot位置
                function updateLightSpots(attribute) {
                    // 更新str光点位置
                    var strValue = parseInt(attribute.str, 10);
                    var strBar = document.getElementById('str-bar-1');
                    var strbarWidth = strBar.clientWidth;
                    var strlightSpot = document.getElementById('str-light-spot');
                    var strlightSpotPosition = (strValue / 100) * strbarWidth;
                    strlightSpot.style.left = strlightSpotPosition + 'px';
                    strlightSpot.style.display = 'block';
                    // 更新dex光点位置
                    var dexValue = parseInt(attribute.dex, 10);
                    var dexBar = document.getElementById('dex-bar-1');
                    var dexbarWidth = dexBar.clientWidth;
                    var dexlightSpot = document.getElementById('dex-light-spot');
                    var dexlightSpotPosition = (dexValue / 100) * dexbarWidth;
                    dexlightSpot.style.left = dexlightSpotPosition + 'px';
                    dexlightSpot.style.display = 'block';
                    // 更新luk光点位置
                    var lukValue = parseInt(attribute.luk, 10);
                    var lukBar = document.getElementById('luk-bar-1');
                    var lukbarWidth = lukBar.clientWidth;
                    var luklightSpot = document.getElementById('luk-light-spot');
                    var luklightSpotPosition = (lukValue / 100) * lukbarWidth;
                    luklightSpot.style.left = luklightSpotPosition + 'px';
                    luklightSpot.style.display = 'block';
                    // 更新int光点位置
                    var intValue = parseInt(attribute.int, 10);
                    var intBar = document.getElementById('int-bar-1');
                    var intbarWidth = intBar.clientWidth;
                    var intlightSpot = document.getElementById('int-light-spot');
                    var intlightSpotPosition = (intValue / 100) * intbarWidth;
                    intlightSpot.style.left = intlightSpotPosition + 'px';
                    intlightSpot.style.display = 'block';
                }

                // 设置人物图片
                const imageElement = document.getElementById('character-image');
                switch (cardNumber) {
                    case '1':
                        imageElement.src = '../images/characterimage1.png';
                        break;
                    case '2':
                        imageElement.src = '../images/characterimage2.png';
                        break;
                    case '3':
                        imageElement.src = '../images/characterimage3.png';
                        break;
                    default:
                        imageElement.src = '../images/characterimage3.png'; // 暂时无用
                }
            } else {
                console.error('未找到对应卡片的数据');
            }
        });

    </script>

    <section id="game-controls">
        <p id="mode-label">{{ '预设剧情试玩 · 无需密钥' if session.mode == 'demo' else 'AI 自由对话 · 需要有效服务凭据' }}</p>
        <p id="game-location"></p>
        <div id="game-actions"></div>
        <details><summary>已发现线索</summary><ul id="game-clues"></ul></details>
        <div id="composer"><input maxlength="4000" aria-label="玩家行动或消息" type="text" id="question" placeholder="Type your message here..."><button id="send-button" onclick="sendMessage()">发送</button></div>
        <div id="game-toolbar"><button id="dice-button">
                <span id="dice-button-text">掷骰子</span>
            </button><button id="voice-button">
                <span id="voice-button-text">语音</span>
            </button></div>
        <p id="game-feedback" aria-live="polite"></p>
        <button id="reset-button">重新开始</button>
        <a id="ending-link" href="/finalend" hidden>查看结局</a>
        <a href="/characterselection">返回选人 / 切换模式</a>
    </section>
    <script src="/static/game.js"></script>
</body>
</html>
